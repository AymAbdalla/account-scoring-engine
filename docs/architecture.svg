<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture at a glance</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4b2ab"/>
    </marker>
  </defs>
  <rect width="1280" height="760" rx="16" fill="#ffffff"/>
  <text x="40" y="58" font-size="26" font-weight="600" fill="#1f1f1f">Scores run on their own every weekday and land on each Account</text>

  <!-- GitHub Actions -->
  <rect x="430" y="90" width="400" height="90" rx="10" fill="#ffffff" stroke="#cfcdc6" stroke-width="2"/>
  <text x="630" y="127" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">GitHub Actions schedule</text>
  <text x="630" y="158" text-anchor="middle" font-size="18" fill="#5c5c5c">weekdays 7 AM ET, plus a Run button</text>
  <line x1="630" y1="180" x2="630" y2="236" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="646" y="214" font-size="18" fill="#5c5c5c">starts it</text>

  <!-- Inputs -->
  <rect x="40" y="240" width="330" height="135" rx="10" fill="#ffffff" stroke="#cfcdc6" stroke-width="2"/>
  <text x="205" y="278" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">Accounts and signals</text>
  <text x="205" y="314" text-anchor="middle" font-size="18" fill="#5c5c5c">sample companies with hiring,</text>
  <text x="205" y="342" text-anchor="middle" font-size="18" fill="#5c5c5c">HR leader and engagement data</text>
  <line x1="370" y1="307" x2="446" y2="307" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="420" width="330" height="135" rx="10" fill="#ffffff" stroke="#cfcdc6" stroke-width="2"/>
  <text x="205" y="458" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">Scoring rules</text>
  <text x="205" y="494" text-anchor="middle" font-size="18" fill="#5c5c5c">weights.yaml: segments, rules</text>
  <text x="205" y="522" text-anchor="middle" font-size="18" fill="#5c5c5c">and tiers that RevOps can edit</text>
  <line x1="370" y1="487" x2="446" y2="487" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Engine -->
  <rect x="450" y="240" width="360" height="330" rx="12" fill="#e8eef9" stroke="#3b73d6" stroke-width="3"/>
  <text x="630" y="278" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">Scoring engine</text>
  <text x="630" y="308" text-anchor="middle" font-size="18" fill="#5c5c5c">Python, runs on its own</text>
  <g font-size="19" fill="#1f1f1f">
    <text x="480" y="352">1. Read accounts and signals</text>
    <text x="480" y="387">2. Sort each into a segment</text>
    <text x="480" y="422">3. Score each account</text>
    <text x="480" y="457">4. List every reason</text>
    <text x="480" y="492">5. Upsert to Salesforce</text>
    <text x="480" y="527">6. Fail loudly on any error</text>
  </g>

  <!-- Salesforce -->
  <rect x="910" y="240" width="330" height="330" rx="10" fill="#ffffff" stroke="#cfcdc6" stroke-width="2"/>
  <text x="1075" y="278" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">Salesforce dev org</text>
  <g font-size="19" fill="#1f1f1f">
    <text x="935" y="324">Account fields: score,</text>
    <text x="935" y="352">tier, every reason,</text>
    <text x="935" y="380">last scored</text>
    <text x="935" y="428">Segment, BDR, region</text>
    <text x="935" y="476">Dashboard by segment,</text>
    <text x="935" y="504">BDR and region</text>
  </g>
  <line x1="910" y1="320" x2="814" y2="320" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="308" text-anchor="middle" font-size="18" fill="#5c5c5c">read back</text>
  <line x1="810" y1="500" x2="906" y2="500" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="860" y="488" text-anchor="middle" font-size="18" fill="#5c5c5c">write</text>

  <!-- Reps -->
  <line x1="1075" y1="570" x2="1075" y2="626" stroke="#b4b2ab" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="910" y="630" width="330" height="105" rx="10" fill="#ffffff" stroke="#cfcdc6" stroke-width="2"/>
  <text x="1075" y="668" text-anchor="middle" font-size="22" font-weight="600" fill="#1f1f1f">60 BDRs</text>
  <text x="1075" y="698" text-anchor="middle" font-size="18" fill="#5c5c5c">5 segments, 4 regions,</text>
  <text x="1075" y="722" text-anchor="middle" font-size="18" fill="#5c5c5c">each sees a ranked list</text>
</svg>
